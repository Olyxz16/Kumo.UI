name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build
      - name: Headless tests
        run: dotnet run --project tests/Kumo.Avalonia.Tests
      - name: Token pipeline check
        run: python3 scripts/generate_tokens.py --check
      - name: Component spec check
        run: python3 scripts/extract_component_specs.py --check
      - name: Pack (dry run)
        run: dotnet pack src/Kumo.Avalonia -c Release -o artifacts

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build + pack
        run: |
          dotnet build
          dotnet pack src/Kumo.Avalonia -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: artifacts/*.snupkg
